<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
   <h1>----- Management System
    </h1>
    <fieldset>
    <!---->
    <legend> Register Here</legend>

    <form action="#" method="post">

    <label for="name">Name:</label>
    <input type="text" name="name" placeholder="write your name" id="name" required > <br> <br>  
     
    <label for="email">Email:</label>
    <input type="text" email="email" id="email" placeholder="Write your email" required > <br> <br> 
    <label for="username">username:</label>
    <input type="text" username="username" id="username" placeholder="Write your username" required > <br> <br> 
    <label for="number">Number:</number:>
    <input type="number"  id="number" placeholder="Write your number"><br> <br>   

    <label for="password">Password:</label>
    <input type="password" password="password" id="password" placeholder="write your pass" required > <br> <br> 
    
    <label for="date">Date Of Birth:</label>
    <input type="date" required> <br> <br>
    <button type="submit">Register</button>
   
    </fieldset>
</body>
</html>
